---
# GitLab CI/CD Pipeline for thread-pool
# SPDX-License-Identifier: Apache-2.0

include:
  - component: gitlab.com/devnw/ci-catalog/security-sast@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/security-secrets@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/zig-format@v1.2.1
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/release-semantic@v1.7.1

variables:
  ZIG_VERSION: "0.15.2"

stages:
  - lint
  - build
  - test
  - fuzz
  - performance
  - security
  - sbom
  - release

.install-zig: &install-zig
  - bash scripts/install-zig.sh "${ZIG_VERSION}"
  - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
  - zig version

zig-format:
  before_script:
    - *install-zig

build:
  stage: build
  image: debian:bookworm-slim
  before_script:
    - apt-get update && apt-get install -y bash curl python3 xz-utils git
    - *install-zig
  script:
    - zig build build
    - zig build check

test-unit:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - apt-get update && apt-get install -y bash curl python3 xz-utils git
    - *install-zig
  script:
    - zig build test --summary all
  needs: ["build"]

test-integration:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - apt-get update && apt-get install -y bash curl python3 xz-utils git
    - *install-zig
  script:
    - zig build test-integration --summary all
  needs: ["build"]

test-stress:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - apt-get update && apt-get install -y bash curl python3 xz-utils git
    - *install-zig
  script:
    - zig build test-stress --summary all
  needs: ["build"]

test-release-safe:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - apt-get update && apt-get install -y bash curl python3 xz-utils git
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseSafe --summary all
  needs: ["build"]

test-release-fast:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - apt-get update && apt-get install -y bash curl python3 xz-utils git
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseFast --summary all
  needs: ["build"]

test-release-small:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - apt-get update && apt-get install -y bash curl python3 xz-utils git
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseSmall --summary all
  needs: ["build"]

cross-linux:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - apt-get update && apt-get install -y bash curl python3 xz-utils git
    - *install-zig
  script:
    - zig build-lib src/root.zig -target x86_64-linux
  needs: ["build"]

cross-macos:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - apt-get update && apt-get install -y bash curl python3 xz-utils git
    - *install-zig
  script:
    - zig build-lib src/root.zig -target aarch64-macos
  needs: ["build"]

cross-windows:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - apt-get update && apt-get install -y bash curl python3 xz-utils git
    - *install-zig
  script:
    - zig build-lib src/root.zig -target x86_64-windows-gnu
  needs: ["build"]

fuzz-regression:
  stage: fuzz
  image: debian:bookworm-slim
  before_script:
    - apt-get update && apt-get install -y bash curl python3 xz-utils git
    - *install-zig
  script:
    # NOTE: Requires fuzz-annotated tests (std.testing.fuzz) in the test binary.
    # Currently runs as a regression gate only — meaningful fuzz coverage depends
    # on adding fuzz targets for queue operations, config validation, and
    # submit/cancel race conditions. See docs/GAP_ANALYSIS.md.
    - timeout 60 zig build test --fuzz; rc=$?; if [ $rc -ne 0 ] && [ $rc -ne 124 ]; then exit $rc; fi
  needs: ["build"]
  allow_failure: true

benchmark-regression:
  stage: performance
  image: debian:bookworm-slim
  before_script:
    - apt-get update && apt-get install -y bash curl python3 xz-utils git
    - *install-zig
  script:
    - zig build bench -- --output benchmarks/results/ci-current.json
    - zig build compare-bench -- --baseline benchmarks/results/baseline.json --current benchmarks/results/ci-current.json
  artifacts:
    when: always
    paths:
      - benchmarks/results/ci-current.json
  needs: ["build"]

scale-bench-manual:
  stage: performance
  image: debian:bookworm-slim
  before_script:
    - apt-get update && apt-get install -y bash curl python3 xz-utils git
    - *install-zig
  script:
    - timeout 120 zig build scale-bench -- --output benchmarks/results/scale-current.json
  artifacts:
    when: always
    paths:
      - benchmarks/results/scale-current.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: manual
  needs: ["build"]
