---
# GitLab CI/CD Pipeline for thread-pool
# SPDX-License-Identifier: Apache-2.0
#
# Reusable components live in gitlab.com/devnw/ci-catalog.
# Zig components pinned at v1.22.0 (first tag with multi-OS + test_step
# + bounded zig-fuzz). Security/SBOM components stay on their existing
# pins since those APIs haven't changed.
#
# Linux jobs run on the self-hosted company Linux runner pool
# (`company` + `linux` + `x86` tags) — the bare `company` tag is shared with
# the Windows runner group, so without `linux` GitLab can route a
# Linux job to a Windows runner and explode on the bash-on-PowerShell
# mismatch. The x86 tag also excludes ARM hosts from x86 scanner jobs.
# macOS jobs use the devnw dedicated Apple Silicon runners
# (`dedicated` + `macos` + `arm` tags);
# Windows jobs use the self-hosted company Windows runner group
# (`company` + `windows` tags) instead of GitLab SaaS. Cross-OS jobs
# are gated behind rules + allow_failure so pipelines without those
# runners still pass. Trigger cross-OS runs by setting RUN_CROSS_OS=true
# or by scheduling / merging to the default branch.

# Cancel in-flight pipelines on new commits for everything except
# release-producing runs (tag pipelines and default-branch pipelines,
# which feed `release-semantic`). All jobs default to interruptible so
# the auto-cancel actually kicks in; opt out per-job when needed.
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_COMMIT_TAG'
      auto_cancel:
        on_new_commit: none
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    # SRE-194: validation pipelines fail fast on the first blocking job failure;
    # these rules admit only what the next rule already admits.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      auto_cancel:
        on_job_failure: all
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      auto_cancel:
        on_job_failure: all
    - when: always

default:
  interruptible: true
  tags:
    - company
    - linux
    - x86

include:
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@v1.63.1
    inputs:
      tags: ["company", "linux", "x86"]
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@v1.63.1
    inputs:
      tags: ["company", "linux", "x86"]
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@v1.63.1
    inputs:
      tags: ["company", "linux", "x86"]
  - component: gitlab.com/devnw/ci-catalog/release-semantic@v1.63.1
    inputs:
      tags: ["company", "linux", "x86"]
      release_auth: job_token

  # Zig formatting (Linux).
  - component: gitlab.com/devnw/ci-catalog/zig-format@v1.63.1
    inputs:
      tags: ["company", "linux", "x86"]
      zig_version: "0.16.0"
      paths: "src/ tests/ benchmarks/ examples/"

  # Zig build (Linux): static lib + check-compile.
  - component: gitlab.com/devnw/ci-catalog/zig-build@v1.63.1
    inputs:
      tags: ["company", "linux", "x86"]
      stage: build
      zig_version: "0.16.0"
      build_options: "build check"

  # Zig tests — Linux matrix across optimize modes + integration + stress.
  # Explicit tags override the catalog's `tags: []` default which would
  # otherwise emit an untagged job that matches any runner (including the
  # company Windows runners — bash-on-PowerShell == fail).
  - component: gitlab.com/devnw/ci-catalog/zig-test@v1.63.1
    inputs:
      zig_version: "0.16.0"
      job_suffix: "-unit-debug"
      test_step: "test"
      optimize: "Debug"
      tags: ["company", "linux", "x86"]
  # Single-pool comptime gate (QR-002): unit suite only with
  # -Dsingle-pool=true so the F-001 identity-check elision keeps
  # compiling and passing. Integration tests are deliberately NOT
  # wired here — two_pool_cross_submit requires multiple pools and
  # must never run under -Dsingle-pool=true.
  - component: gitlab.com/devnw/ci-catalog/zig-test@v1.63.1
    inputs:
      zig_version: "0.16.0"
      job_suffix: "-unit-single-pool"
      test_step: "test"
      test_options: "--summary all -Dsingle-pool=true"
      optimize: "Debug"
      tags: ["company", "linux", "x86"]
  - component: gitlab.com/devnw/ci-catalog/zig-test@v1.63.1
    inputs:
      zig_version: "0.16.0"
      job_suffix: "-unit-releasesafe"
      test_step: "test"
      optimize: "ReleaseSafe"
      tags: ["company", "linux", "x86"]
  - component: gitlab.com/devnw/ci-catalog/zig-test@v1.63.1
    inputs:
      zig_version: "0.16.0"
      job_suffix: "-unit-releasefast"
      test_step: "test"
      optimize: "ReleaseFast"
      tags: ["company", "linux", "x86"]
  - component: gitlab.com/devnw/ci-catalog/zig-test@v1.63.1
    inputs:
      zig_version: "0.16.0"
      job_suffix: "-unit-releasesmall"
      test_step: "test"
      optimize: "ReleaseSmall"
      tags: ["company", "linux", "x86"]
  - component: gitlab.com/devnw/ci-catalog/zig-test@v1.63.1
    inputs:
      zig_version: "0.16.0"
      job_suffix: "-integration"
      test_step: "test-integration"
      tags: ["company", "linux", "x86"]
  - component: gitlab.com/devnw/ci-catalog/zig-test@v1.63.1
    inputs:
      zig_version: "0.16.0"
      job_suffix: "-stress"
      test_step: "test-stress"
      tags: ["company", "linux", "x86"]

  # Fuzz sweep (advisory). fuzz_duration is the in-shell SIGINT
  # budget; timeout: is GitLab's job cap.
  - component: gitlab.com/devnw/ci-catalog/zig-fuzz@v1.63.1
    inputs:
      tags: ["company", "linux", "x86"]
      zig_version: "0.16.0"
      test_step: "test"
      test_options: "--fuzz"
      fuzz_duration: "60"
      # Include cold autoscaler startup and toolchain setup in the job cap.
      timeout: "15m"
      allow_failure: true

  # Zig build + tests on macOS (gated).
  - component: gitlab.com/devnw/ci-catalog/zig-build-macos@v1.63.1
    inputs:
      tags: [dedicated, macos, arm]
      zig_version: "0.16.0"
      build_step: "build"
      build_options: "check"
  - component: gitlab.com/devnw/ci-catalog/zig-test-macos@v1.63.1
    inputs:
      tags: [dedicated, macos, arm]
      zig_version: "0.16.0"
      job_suffix: "-unit"
      test_step: "test"
  - component: gitlab.com/devnw/ci-catalog/zig-test-macos@v1.63.1
    inputs:
      tags: [dedicated, macos, arm]
      zig_version: "0.16.0"
      job_suffix: "-integration"
      test_step: "test-integration"
  - component: gitlab.com/devnw/ci-catalog/zig-test-macos@v1.63.1
    inputs:
      tags: [dedicated, macos, arm]
      zig_version: "0.16.0"
      job_suffix: "-stress"
      test_step: "test-stress"

  # Zig build + tests on Windows (gated). tags override routes these to
  # the self-hosted company Windows runner group; remove the override
  # once ci-catalog >v1.22.0 lands and bakes the new default in.
  - component: gitlab.com/devnw/ci-catalog/zig-build-windows@v1.63.1
    inputs:
      zig_version: "0.16.0"
      build_step: "build"
      build_options: "check"
      tags: ["company", "windows"]
  - component: gitlab.com/devnw/ci-catalog/zig-test-windows@v1.63.1
    inputs:
      zig_version: "0.16.0"
      job_suffix: "-unit"
      test_step: "test"
      tags: ["company", "windows"]
  - component: gitlab.com/devnw/ci-catalog/zig-test-windows@v1.63.1
    inputs:
      zig_version: "0.16.0"
      job_suffix: "-integration"
      test_step: "test-integration"
      tags: ["company", "windows"]
  - component: gitlab.com/devnw/ci-catalog/zig-test-windows@v1.63.1
    inputs:
      zig_version: "0.16.0"
      job_suffix: "-stress"
      test_step: "test-stress"
      tags: ["company", "windows"]
  - component: gitlab.com/devnw/ci-catalog/zig-version-tag-check@v1.63.1
    inputs:
      tags: ["company", "linux", "x86"]

variables:
  ZIG_VERSION: "0.16.0"

stages:
  - lint
  - build
  - test
  - fuzz
  - performance
  - security
  - sbom
  - release

# ---------------------------------------------------------------
# Cross-OS gating: apply rules to the catalog-generated jobs so
# macOS / Windows only run on default branch, schedule, or when
# RUN_CROSS_OS=true. Elsewhere they fall back to manual.
# ---------------------------------------------------------------

.cross-os-rules: &cross-os-rules
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  - if: '$CI_PIPELINE_SOURCE == "schedule"'
  - if: '$RUN_CROSS_OS == "true"'
  - when: manual
    allow_failure: true

zig-build-macos-0.16.0:
  rules: *cross-os-rules

zig-test-macos-unit-0.16.0:
  rules: *cross-os-rules
  needs: ["zig-build-macos-0.16.0"]

zig-test-macos-integration-0.16.0:
  rules: *cross-os-rules
  needs: ["zig-build-macos-0.16.0"]

zig-test-macos-stress-0.16.0:
  rules: *cross-os-rules
  needs: ["zig-build-macos-0.16.0"]

zig-build-windows-0.16.0:
  rules: *cross-os-rules

zig-test-windows-unit-0.16.0:
  rules: *cross-os-rules
  needs: ["zig-build-windows-0.16.0"]

zig-test-windows-integration-0.16.0:
  rules: *cross-os-rules
  needs: ["zig-build-windows-0.16.0"]

zig-test-windows-stress-0.16.0:
  rules: *cross-os-rules
  needs: ["zig-build-windows-0.16.0"]

# ---------------------------------------------------------------
# Thread-pool-specific jobs (not covered by the catalog).
#
# We install Zig directly via scripts/install-zig.sh on a stock
# ubuntu:24.04 image rather than pulling a prebuilt catalog image.
# The catalog publishes :0.15.2 but not :0.16.0 (as of v1.22.0); the
# catalog-driven zig-build / zig-test jobs avoid the image entirely
# and bootstrap zig themselves, so we mirror that pattern here.
# ---------------------------------------------------------------

.zig-host-base:
  # Pinned by digest (GAP-0042): manifest-list digest for ubuntu:24.04
  # as of 2026-06-11. Refresh with
  # `docker buildx imagetools inspect ubuntu:24.04` (or
  # `skopeo inspect --format '{{.Digest}}' docker://docker.io/library/ubuntu:24.04`)
  # and update both the digest and this date.
  image: "ubuntu:26.04@sha256:d66b366dac61b575bee2aef07e9c26e8070096fbe84a3d4d3eb0da069b5d76db"
  interruptible: true
  before_script:
    - apt-get -o Acquire::Retries=5 update -qq && { apt-get -o Acquire::Retries=5 install -y --no-install-recommends curl ca-certificates xz-utils git build-essential python3 || { apt-get -o Acquire::Retries=5 update -qq && apt-get -o Acquire::Retries=5 install -y --no-install-recommends --fix-missing curl ca-certificates xz-utils git build-essential python3; }; }
    - bash scripts/install-zig.sh "$ZIG_VERSION"
    - export PATH="$(pwd)/zig-${ZIG_VERSION}:$PATH"
    - zig version

cross-check:
  extends: .zig-host-base
  stage: test
  # The dedicated `cross-check` build step was removed in commit ee8440f
  # (it created duplicate root modules in downstream consumers). Cross-
  # target smoke coverage now happens here via explicit per-target
  # invocations, matching the convention recommended in build.zig.
  script:
    - zig build -Dtarget=x86_64-linux
    - zig build -Dtarget=aarch64-macos
    - zig build -Dtarget=x86_64-windows-gnu
  needs: ["zig-build-0.16.0"]

benchmark-regression:
  extends: .zig-host-base
  stage: performance
  script:
    - zig build bench -- --output benchmarks/results/ci-current.json
    - zig build compare-bench -- --baseline benchmarks/results/baseline.json --current benchmarks/results/ci-current.json
  artifacts:
    when: always
    paths:
      - benchmarks/results/ci-current.json
  needs: ["zig-build-0.16.0"]

bench-micro:
  extends: .zig-host-base
  stage: performance
  script:
    - zig build bench-micro-submit > micro-submit.txt
    - zig build bench-micro-steal > micro-steal.txt
    - zig build bench-micro-wake > micro-wake.txt
    - zig build bench-tokio-parity > tokio-parity.txt
    - cat micro-submit.txt micro-steal.txt micro-wake.txt tokio-parity.txt
  artifacts:
    when: always
    paths:
      - micro-submit.txt
      - micro-steal.txt
      - micro-wake.txt
      - tokio-parity.txt
  needs: ["zig-build-0.16.0"]
  allow_failure: true # advisory until thresholds are tuned

scale-bench-manual:
  extends: .zig-host-base
  stage: performance
  script:
    - timeout 120 zig build scale-bench -- --output benchmarks/results/scale-current.json
  artifacts:
    when: always
    paths:
      - benchmarks/results/scale-current.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: manual
      allow_failure: true
  needs: ["zig-build-0.16.0"]

# ---------------------------------------------------------------
# ThreadSanitizer soak — scheduled / on-demand.
#
# These jobs pin their own Zig install via scripts/install-zig.sh on a
# stock ubuntu:24.04 image. The manual install is intentional and
# independent of the catalog image so a TSan regression isn't masked
# by a coincident catalog image version bump, and so the soak remains
# reproducible from a fresh image.
#
# TSan warnings are never "just noise" for a concurrency primitive —
# any finding is a real signal. Because TSan instrumentation is
# expensive, we don't run these on every MR. They run on schedule,
# default branch, or when RUN_TSAN=true is set on the pipeline.
#
# Current state on main (2026-04-15): zero warnings across test,
# test-integration, test-stress under TSan. See
# docs/performance/appsec-fixes-2026-04-15/TSAN-findings.md.
# ---------------------------------------------------------------

.tsan-rules: &tsan-rules
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  - if: '$CI_PIPELINE_SOURCE == "schedule"'
  - if: '$RUN_TSAN == "true"'
  - when: manual
    allow_failure: true

.tsan-base:
  extends: .zig-host-base
  stage: test
  rules: *tsan-rules

tsan-stress-soak:
  extends: .tsan-base
  script:
    # Run each suite under TSan three times; a single pass takes ~15s so
    # three back-to-back passes give longer interleaving coverage.
    - zig build test-tsan --summary all
    - for i in 1 2 3; do echo "--- soak pass $i ---"; zig build test -Dtsan --summary all; done
    - for i in 1 2 3; do echo "--- integration soak pass $i ---"; zig build test-integration -Dtsan --summary all; done
    - for i in 1 2 3; do echo "--- stress soak pass $i ---"; zig build test-stress -Dtsan --summary all; done
  timeout: 30m

tsan-fuzz:
  extends: .tsan-base
  variables:
    FUZZ_SEED: "1"
    FUZZ_ITERATIONS: "5000"
  script:
    - zig build fuzz -Dtsan
    - FUZZ_SEED=2 zig build fuzz -Dtsan
    - FUZZ_SEED=3 zig build fuzz -Dtsan
  timeout: 30m

# SONNY-4778: external hook tools must preserve the enclosing worktree.
hook-env-regression:
  stage: lint
  image: python:3.15-slim-bookworm
  tags: [company, linux, x86]
  before_script:
    - apt-get -o Acquire::Retries=5 update -qq && { apt-get -o Acquire::Retries=5 install -y --no-install-recommends git || { apt-get -o Acquire::Retries=5 update -qq && apt-get -o Acquire::Retries=5 install -y --no-install-recommends --fix-missing git; }; }
  script:
    - python3 scripts/test_hook_env.py
